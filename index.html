<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISION CASHOUT BENIN</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:15px;text-align:center}
.box{background:#111;padding:20px;border-radius:15px;margin:15px 0;border:1px solid #333}
input,select{width:92%;padding:15px;border-radius:10px;border:0;margin:8px 0;font-size:15px}
button{width:92%;padding:18px;border-radius:12px;border:0;font-weight:bold;font-size:16px;margin:8px 0;cursor:pointer}
.starter{background:#fff;color:#000}.pro{background:#00e5ff;color:#000}.boss{background:#a020f0;color:#fff}
.login{background:#222;border:2px dashed gold}
</style>
</head>
<body>
<h1 style="color:gold">VISION CASHOUT 🇧🇯</h1>
<p>Gagne 1000F par vidéo de 30s</p>

<div class="box login">
<h3 style="color:gold">🔑 DÉJÀ INSCRIT?</h3>
<p style="font-size:13px;color:#aaa">Récupère ton ancien compte</p>
<input id="login_tel" type="tel" placeholder="Ton numéro WhatsApp">
<button onclick="login()" style="background:#00c853;color:#fff">RÉCUPÉRER MON COMPTE ✅</button>
</div>

<div class="box">
<h3 style="color:gold">1. NOUVELLE INSCRIPTION</h3>
<input id="nom" placeholder="Ton nom complet">
<select id="pays">
<option value="">Choisis ton pays</option>
<option>Bénin 🇧🇯</option><option>Burkina Faso 🇧🇫</option><option>Cameroun 🇨🇲</option><option>Côte d'Ivoire 🇨🇮</option><option>Gabon 🇬🇦</option><option>Ghana 🇬🇭</option><option>Guinée 🇬🇳</option><option>Mali 🇲🇱</option><option>Niger 🇳🇪</option><option>Nigéria 🇳🇬</option><option>RD Congo 🇨🇩</option><option>Sénégal 🇸🇳</option><option>Togo 🇹🇬</option>
<option>Autre Afrique 🌍</option>
</select>
<input id="tel" type="tel" placeholder="Numéro WhatsApp">
<input id="momo" type="tel" placeholder="Numéro MoMo pour recevoir l'argent">
<button onclick="save()" style="background:gold">S'INSCRIRE ✅</button>
</div>

<div class="box">
<h3 style="color:gold">2. CHOISIS TON PACK</h3>
<button class="starter" onclick="pay('starter','https://new.sebpay.bj/pay/vision-cashout-a27CDC')">PACK STARTER 1500F<br>15 vidéos / jour = 15.000F</button>
<button class="pro" onclick="pay('pro','https://new.sebpay.bj/pay/vision-cashout-BKzTHi')">PACK PRO 2800F<br>25 vidéos / jour = 25.000F</button>
<button class="boss" onclick="pay('boss','https://new.sebpay.bj/pay/transport-5dAK4L')">PACK BOSS 4000F<br>30 vidéos / jour = 30.000F</button>
</div>
<p style="color:#666;font-size:12px">Service client WhatsApp: +229 01 49 51 51 68 </p>

<script>
function getUsers(){ return JSON.parse(localStorage.getItem('vc_users')||'{}'); }
function setUsers(u){ localStorage.setItem('vc_users', JSON.stringify(u)); }

function save(){
let n=document.getElementById('nom').value.trim();
let p=document.getElementById('pays').value;
let t=document.getElementById('tel').value.trim();
let m=document.getElementById('momo').value.trim();
if(n.length<2){alert('Entre ton nom');return}
if(!p){alert('Choisis ton pays');return}
if(t.length<8){alert('Numéro WhatsApp invalide');return}
if(m.length<8){alert('Numéro MoMo invalide');return}

let users=getUsers();
if(users[t]){
  localStorage.setItem('nom', users[t].nom);
  localStorage.setItem('pays', users[t].pays);
  localStorage.setItem('tel', users[t].tel);
  localStorage.setItem('momo', users[t].momo);
  localStorage.setItem('pack', users[t].pack);
  localStorage.setItem('solde', users[t].solde||0);
  alert('Compte déjà existant! On t\'a reconnecté '+users[t].nom+' Solde: '+(users[t].solde||0)+'F');
  location.href='videos.html';
  return;
}
// NOUVEAU: On ne donne PAS de pack par défaut
users[t]={nom:n,pays:p,tel:t,momo:m,solde:0,pack:''};
setUsers(users);

localStorage.setItem('nom',n);localStorage.setItem('pays',p);localStorage.setItem('tel',t);localStorage.setItem('momo',m);
localStorage.setItem('solde','0');
localStorage.removeItem('pack');
alert('Bienvenue '+n+'! Maintenant choisis ton PACK et PAYE pour commencer 👇');
}

function login(){
let t=document.getElementById('login_tel').value.trim();
if(t.length<8){alert('Entre ton numéro WhatsApp');return}
let users=getUsers();
if(!users[t]){alert('Aucun compte trouvé avec '+t+'. Inscris-toi en bas.');return}
if(!users[t].pack){alert('Compte trouvé mais tu n\'as pas encore payé de pack. Choisis un pack après connexion.');}
localStorage.setItem('nom', users[t].nom);
localStorage.setItem('pays', users[t].pays);
localStorage.setItem('tel', users[t].tel);
localStorage.setItem('momo', users[t].momo);
localStorage.setItem('pack', users[t].pack||'');
localStorage.setItem('solde', users[t].solde||0);
if(users[t].pack){
  alert('Bienvenue '+users[t].nom+'! Solde: '+(users[t].solde||0)+'F | Pack: '+users[t].pack);
  location.href='videos.html';
} else {
  alert('Bienvenue '+users[t].nom+'! Tu dois payer un pack pour continuer.');
}
}

function pay(pack,url){
let t=localStorage.getItem('tel') || document.getElementById('tel').value.trim();
if(!t || t.length<8){alert('Remplis l\'inscription d\'abord!');return}
// On met SEULEMENT en attente, pas validé
localStorage.setItem('pack_en_attente',pack);
location.href=url;
}

// Retour de LomoPay
let params = new URLSearchParams(window.location.search);
let paid = params.get('paid');
if(paid){
  let t=localStorage.getItem('tel');
  localStorage.setItem('pack',paid);
  localStorage.removeItem('pack_en_attente');
  let users=getUsers();
  if(users[t]){users[t].pack=paid; setUsers(users);}
  window.location.href='videos.html?paid='+paid;
}
</script>
</body>
  </html>
