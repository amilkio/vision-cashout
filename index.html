<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vision Cashout - 1000F par Vidéo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;padding-bottom:90px}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#0a0a0a;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
.logo{color:#00d9ff;font-weight:900}
.badge{background:#222;border:1px solid #444;padding:5px 12px;border-radius:20px;font-size:13px}
.btn-r{background:#00ff88;color:#000;border:none;padding:7px 14px;border-radius:20px;font-weight:800}
.box{padding:12px 15px}
.bar{height:8px;background:#222;border-radius:10px;overflow:hidden}
.fill{height:100%;background:#00d9ff;width:0%}
.card{display:flex;justify-content:space-between;align-items:center;background:#111;border:1px solid #222;margin:8px 15px;padding:10px;border-radius:12px}
.card-left{display:flex;gap:10px;align-items:center}
.thumb{width:60px;height:42px;background:#222;border-radius:8px}
.play{background:#1a3a4a;color:#00d9ff;border:none;width:34px;height:34px;border-radius:8px}
#paywall{border:2px solid #00d9ff;border-radius:18px;margin:15px;padding:22px;text-align:center;background:#111}
.pack{width:92%;margin:8px auto;display:block;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:16px}
.p1{background:#fff;color:#000}.p2{background:#00d9ff;color:#000}.p3{background:#a020f0;color:#fff}
.msg{display:none;background:#00ff88;color:#000;padding:10px;margin:12px;border-radius:10px;text-align:center;font-weight:800}
.timer{font-size:11px;color:#ffaa00;display:none}
</style>
</head>
<body>
<div class="header"><div class="logo">VISION CASHOUT</div><div style="display:flex;gap:8px"><div class="badge">💰 <span id="bal">0</span>F</div><button class="btn-r" onclick="retirer()">RETIRER</button></div></div>
<div class="box"><div style="display:flex;justify-content:space-between;font-size:12px;color:#aaa"><span><span id="watch">0</span>/<span id="max">15</span> aujourd'hui</span><span id="gainInfo">1000F / vidéo</span></div><div class="bar"><div class="fill" id="prog"></div></div><div style="font-size:11px;color:#666;margin-top:4px" id="packInfo"></div></div>
<div id="ok" class="msg"></div>
<div id="paywall"><div style="font-size:38px">🔒</div><h2 style="color:#00d9ff">Vidéos Bloquées</h2><p style="font-size:14px;color:#ccc;margin-top:6px">Débloque un Pack pour gagner <b style="color:#00ff88" id="highlightGain">1000F par vidéo de 30s</b><br>15 à 40 vidéos par jour selon ton Pack</p></div>
<div id="videos">
<div class="card"><div class="card-left"><div class="thumb"></div><div><b>Pub MTN</b><br><span style="color:#00ff88;font-size:12px" class="g">+1000F</span> <div class="timer" id="t1"></div></div></div><button class="play" onclick="watch(1)">▶</button></div>
<div class="card"><div class="card-left"><div class="thumb"></div><div><b>MoMo Bénin</b><br><span style="color:#00ff88;font-size:12px" class="g">+1000F</span> <div class="timer" id="t2"></div></div></div><button class="play" onclick="watch(2)">▶</button></div>
<div class="card"><div class="card-left"><div class="thumb"></div><div><b>Parrainage</b><br><span style="color:#00ff88;font-size:12px" class="g">+1000F</span> <div class="timer" id="t3"></div></div></div><button class="play" onclick="watch(3)">▶</button></div>
<div class="card"><div class="card-left"><div class="thumb"></div><div><b>Vision Cashout</b><br><span style="color:#00ff88;font-size:12px" class="g">+1000F</span> <div class="timer" id="t4"></div></div></div><button class="play" onclick="watch(4)">▶</button></div>
</div>
<div style="margin-top:10px">
<button class="pack p1" onclick="go('starter')">PACK STARTER 1.500F → 1000F x 15 VIDEOS</button>
<button class="pack p2" onclick="go('pro')">PACK PRO 2.800F → 1000F x 25 VIDEOS</button>
<button class="pack p3" onclick="go('boss')">PACK BOSS 4.000F → 1500F x 40 VIDEOS</button>
<p style="text-align:center;color:#555;font-size:11px;margin-top:8px">Paiement sécurisé LomoPay - Déblocage instantané</p>
</div>
<script>
const LINKS={starter:"https://lomopay.net/pay/a75cd502",pro:"https://lomopay.net/pay/05dcc181",boss:"https://lomopay.net/pay/f4b23d70"};
const PACKS={
 starter:{price:1500,gain:1000,max:15,label:"STARTER 1500F"},
 pro:{price:2800,gain:1000,max:25,label:"PRO 2800F"},
 boss:{price:4000,gain:1500,max:40,label:"BOSS 4000F"}
};
function go(p){location.href=LINKS[p];}
function todayStr(){return new Date().toISOString().split('T')[0];}
function check(){
 const params=new URLSearchParams(location.search);
 const paid=params.get('paid');
 if(paid){localStorage.setItem('vc_paid','true');localStorage.setItem('vc_pack',paid);localStorage.setItem('vc_date',todayStr());localStorage.setItem('vc_today','0');history.replaceState({},'',location.pathname);}
 if(localStorage.getItem('vc_paid')!=='true'){document.getElementById('videos').style.display='none';return;}
 const pack=localStorage.getItem('vc_pack')||'starter';
 const conf=PACKS[pack]||PACKS.starter;
 if(localStorage.getItem('vc_date')!==todayStr()){localStorage.setItem('vc_date',todayStr());localStorage.setItem('vc_today','0');}
 document.getElementById('paywall').style.display='none';
 document.getElementById('videos').style.display='block';
 document.getElementById('ok').style.display='block';
 document.getElementById('ok').innerText='✅ Pack '+conf.label+' activé - '+conf.gain+'F / vidéo - '+conf.max+' vidéos/jour';
 document.getElementById('gainInfo').innerText=conf.gain+'F / vidéo';
 document.getElementById('max').innerText=conf.max;
 document.getElementById('highlightGain').innerText=conf.gain+'F par vidéo';
 document.getElementById('packInfo').innerText='Pack actif: '+conf.label+' | Limite: '+conf.max+' vidéos aujourd\'hui';
 document.querySelectorAll('.g').forEach(e=>e.innerText='+'+conf.gain+'F');
}
let bal=parseInt(localStorage.getItem('vc_bal')||'0');
let today=parseInt(localStorage.getItem('vc_today')||'0');
let total=parseInt(localStorage.getItem('vc_total')||'0');
function refresh(){document.getElementById('bal').innerText=bal;document.getElementById('watch').innerText=today;const pack=localStorage.getItem('vc_pack')||'starter';const conf=PACKS[pack]||PACKS.starter;document.getElementById('prog').style.width=(today/conf.max*100)+'%';}
function watch(id){
 if(localStorage.getItem('vc_paid')!=='true'){alert('Paye un Pack d\'abord');return;}
 const pack=localStorage.getItem('vc_pack')||'starter';const conf=PACKS[pack];
 if(today>=conf.max){alert('⛔ Limite atteinte! Tu as regardé '+conf.max+' vidéos aujourd\'hui. Reviens demain');return;}
 const t=document.getElementById('t'+id);t.style.display='block';let s=30;t.innerText=s+'s';
 const it=setInterval(()=>{s--;t.innerText=s+'s';if(s<=0){clearInterval(it);t.innerText='✅ +'+conf.gain+'F';t.style.color='#00ff88';bal+=conf.gain;today++;total++;localStorage.setItem('vc_bal',bal);localStorage.setItem('vc_today',today);localStorage.setItem('vc_total',total);refresh();if(today>=conf.max){alert('Bravo! Tu as atteint ta limite de '+conf.max+' vidéos aujourd\'hui.');}}},1000);
 window.open('https://www.youtube.com/shorts','_blank');
}
function retirer(){if(bal<5000){alert('Solde '+bal+'F - Minimum 5000F pour retirer.');return;}alert('Retrait de '+bal+'F demandé!');}
check();refresh();
</script>
</body>
  </html>
