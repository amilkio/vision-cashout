<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISION CASHOUT BENIN</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:15px;text-align:center}
.box{background:#111;padding:20px;border-radius:15px;margin:15px 0;border:1px solid #333}
input,select{width:92%;padding:15px;border-radius:10px;border:0;margin:8px 0;font-size:15px}
button{width:92%;padding:18px;border-radius:12px;border:0;font-weight:bold;font-size:16px;margin:8px 0;cursor:pointer}
.starter{background:#fff;color:#000}.pro{background:#00e5ff;color:#000}.boss{background:#a020f0;color:#fff}
</style>
</head>
<body>
<h1 style="color:gold">VISION CASHOUT 🇧🇯</h1>
<p>Gagne 1000F par vidéo de 30s</p>

<div class="box">
<h3 style="color:gold">1. INSCRIPTION</h3>
<input id="nom" placeholder="Ton nom complet">
<select id="pays">
<option value="">Choisis ton pays</option>
<option>Bénin 🇧🇯</option>
<option>Togo 🇹🇬</option>
<option>Burkina Faso 🇧🇫</option>
<option>Côte d'Ivoire 🇨🇮</option>
<option>Sénégal 🇸🇳</option>
<option>Cameroun 🇨🇲</option>
<option>Niger 🇳🇪</option>
<option>Mali 🇲🇱</option>
</select>
<input id="tel" type="tel" placeholder="Numéro WhatsApp">
<input id="momo" type="tel" placeholder="Numéro MoMo pour recevoir l'argent">
<button onclick="save()" style="background:gold">S'INSCRIRE ✅</button>
</div>

<div class="box">
<h3 style="color:gold">2. CHOISIS TON PACK</h3>
<button class="starter" onclick="pay('starter','https://lomopay.net/pay/a75cd502')">PACK STARTER 1500F<br>15 vidéos / jour = 15.000F</button>
<button class="pro" onclick="pay('pro','https://lomopay.net/pay/05dcc181')">PACK PRO 2800F<br>25 vidéos / jour = 25.000F</button>
<button class="boss" onclick="pay('boss','https://lomopay.net/pay/f4b23d70')">PACK BOSS 4000F<br>30 vidéos / jour = 30.000F</button>
</div>

<script>
function save(){
let n=document.getElementById('nom').value;
let p=document.getElementById('pays').value;
let t=document.getElementById('tel').value;
let m=document.getElementById('momo').value;
if(n.length<2){alert('Entre ton nom');return}
if(!p){alert('Choisis ton pays');return}
if(t.length<8){alert('Numéro WhatsApp invalide');return}
if(m.length<8){alert('Numéro MoMo invalide');return}
localStorage.setItem('nom',n);localStorage.setItem('pays',p);localStorage.setItem('tel',t);localStorage.setItem('momo',m);
alert('Bienvenue '+n+'! Choisis ton PACK maintenant 👇');
}
function pay(pack,url){
if(!localStorage.getItem('tel')){alert('Remplis l\'inscription d\'abord!');return}
localStorage.setItem('pack',pack);location.href=url;
}
</script>
</body>
</html>
