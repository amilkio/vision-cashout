<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mes 30 Videos</title><style>body{background:#000;color:#fff;font-family:Arial;padding:10px}.top{position:sticky;top:0;background:#111;border:2px solid gold;border-radius:15px;padding:15px;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.card{background:#111;border-radius:12px;padding:10px;text-align:center;border:1px solid #333}.card button{width:100%;padding:12px;border-radius:8px;border:0;font-weight:bold;background:gold;margin-top:8px}.done{background:#00c853!important;color:white}</style></head><body><div class="top"><div>💰 Solde: <span id="solde">0</span>F</div><button onclick="retirer()" style="background:#00e5ff;padding:8px 15px;border-radius:20px;border:0;font-weight:bold">RETIRER</button></div><h2 style="text-align:center;color:gold">30 VIDEOS = 30.000F</h2><div class="grid" id="grid"></div><script>let solde=parseInt(localStorage.getItem('solde')||0);document.getElementById('solde').innerText=solde;let grid=document.getElementById('grid');for(let i=1;i<=30;i++){let vu=localStorage.getItem('v'+i);grid.innerHTML+=`<div class="card"><div style="background:#222;height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:30px">🎬</div><p>Video ${i}</p><p style="color:gold">+1000F</p><button id="b${i}" class="${vu?'done':''}" onclick="voir(${i})">${vu?'✅ VU +1000F':'REGARDER 30s'}</button></div>`}function voir(n){let btn=document.getElementById('b'+n);if(localStorage.getItem('v'+n))return;btn.innerText='⏳ 30s...';let c=30;let t=setInterval(()=>{c--;btn.innerText='⏳ '+c+'s';if(c<=0){clearInterval(t);localStorage.setItem('v'+n,'1');solde+=1000;localStorage.setItem('solde',solde);document.getElementById('solde').innerText=solde;btn.innerText='✅ VU +1000F';btn.className='done';alert('Bravo ! +1000F Solde: '+solde+'F')}},1000)}function retirer(){if(solde<5000){alert('Minimum 5000F. Tu as '+solde+'F');return}let num=prompt('Solde: '+solde+'F\nNumero MoMo:');if(num){alert('Demande envoyee '+solde+'F sur '+num);localStorage.setItem('solde',0)}}</script></body></html>
